name: User story
description: Describe a user-centered requirement with clear completion criteria
title: "[Story]: "
labels:
  - user story
body:
  # Statement
  - type: textarea
    id: statement
    attributes:
      label: Statement
      description: What is your user story?
      placeholder: "As a <stakeholder>, I want <capability> so that <benefit>."

  # Acceptance criteria
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What do you want accomplished in this user story?
      placeholder: |
        - Given ..., when ..., then ...
        - Given ..., when ..., then ...
    validations:
      required: true

  # Notes and dependencies
  - type: textarea
    id: notes
    attributes:
      label: Notes and Dependencies
      description: Add designs, edge cases, dependencies, links, or open questions.
