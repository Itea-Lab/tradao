name: Bug report
description: Report a reproducible problem in the project
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough detail for someone else to reproduce and investigate the problem.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What went wrong? Include the affected feature or page.
      placeholder: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of steps that consistently shows the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact error messages.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, device, app version, or deployment URL as relevant.
      placeholder: e.g. Windows 11, Chrome 140, staging
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and additional context
      description: Add screenshots, logs, links, or anything else that helps investigation.
