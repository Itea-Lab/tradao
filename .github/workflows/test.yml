# `app/` directory holds a SvelteKit application with Vitest (Webdriver + v8 coverage).
# `package.json` scripts:
# + "test:unit": "vitest",
# + "test": "npm run test:unit -- --run"

# Run tests on push to init and on pull request to init.
name: Test

on:
  push:
    branches: [init]
  pull_request:
    branches: [init]

jobs:
  test-app:
    name: Test SvelteKit app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 25.x
        uses: actions/setup-node@v6
        with:
          node-version: 25.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test:unit -- --run
        env:
          IS_CI: true
