# `app/` directory holds a SvelteKit application with Vitest (Webdriver + v8 coverage).
# `package.json` scripts:
# + "test:unit": "vitest",
# + "test": "npm run test:unit -- --run"

# Run tests on push to init and on pull request to init.
name: Test

on:
  push:
    branches: [init]
  pull_request:
    branches: [init]

jobs:
  test:
    name: Run tests and SonarQube scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Use Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare
        run: npm run prepare

      - name: Run tests
        run: npm run test:unit -- --run
        env:
          IS_CI: true
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        if: ${{ !cancelled() }}
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
