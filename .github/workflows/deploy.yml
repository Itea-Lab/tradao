# https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
name: Release to production

on:
  # Manual deployment (useful when release tests fail)
  workflow_dispatch:

  # Deploy on published releases
  release:
    types:
      - published

jobs:
  test:
    name: Run tests
    uses: $/.github/workflows/test.yml
    secrets: inherit

  deploy-app:
    name: Deploy SvelteKit application
    runs-on: ubuntu-slim
    timeout-minutes: 15
    needs: test
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build SvelteKit app
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./app
          command: deploy --message "Deploy from GitHub Actions"

  deploy-email-notifications:
    name: Deploy Email Notification service
    runs-on: ubuntu-slim
    timeout-minutes: 15
    needs: test
    defaults:
      run:
        working-directory: ./email-notifications

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: email-notifications/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: ./email-notifications
          command: deploy --strict --minify --message "Deploy from GitHub Actions"
          secrets: |
            DB_URL
            DB_KEY
            SMTP_HOST
            SMTP_PORT
            SMTP_USER
            SMTP_PASS
            MAIL_FROM_NAME
            MAIL_FROM_EMAIL
            MAIL_TO_EMAIL
        env:
          DB_URL: ${{ secrets.SUPABASE_URL }}
          DB_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM_NAME: Minh-Triet at Itea Lab
          MAIL_FROM_EMAIL: djv137nam@gmail.com
          MAIL_TO_EMAIL: djv137nam@gmail.com
